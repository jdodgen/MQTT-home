<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; margin: 20px; line-height: 1.6; height: 100%; box-sizing: border-box; }
        nav { background: #334; padding: 10px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: white; text-decoration: none; margin-right: 15px; padding: 5px 10px; }
        nav a:hover { background: #555; border-radius: 3px; }
        .active { background: #007bff; border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f4f4f4; }
        
        /* Layout flex constraints to make the iframe fill the screen */
        .refill-area { 
            background: #f9f9f9; 
            padding: 15px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            min-height: calc(100vh - 160px); /* Changed from height to min-height */
            display: flex; 
            flex-direction: column; 
        }
        iframe { flex-grow: 1; width: 100%; border: none; }

          /* The magic line: Strips everything from the outer container table */
          .outer-table, .outer-table td { border: none !important; }

          /* Normal rules for your real tables */
          .inner-table { border-collapse: collapse; width: 100%; }
          .inner-table td, .inner-table th { border: 1px solid #ddd; padding: 8px; }
    </style>
    <title>{% block title %}AlertAway Toolbox{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">

</head>
<body>
    {{ nav_section|safe }}
    
    <div class="refill-area">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
